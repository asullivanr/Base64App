services:
  base64:
    image: nginx:1.30.6-alpine-slim
    user: nginx
    entrypoint: ["/bin/sh", "/usr/local/bin/container-start"]
    command: ["nginx", "-g", "daemon off;"]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./scripts/container-start.sh:/usr/local/bin/container-start:ro
      - ./public:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped
    environment:
      SITE_GITHUB_URL: ${SITE_GITHUB_URL:-}
      SITE_GITHUB_REF: ${SITE_GITHUB_REF:-HEAD}
      SITE_SUBDIR: ${SITE_SUBDIR:-.}
    ports:
      - "${HOST_BIND:-127.0.0.1}:${HOST_PORT:-0}:80"
    # Allow the unprivileged nginx process to bind port 80 in this container.
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
