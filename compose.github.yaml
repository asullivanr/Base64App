# Standalone CasaOS import: no host files, build, or .env required.
name: base64app-github
services:
  base64:
    image: nginx:1.30.6-alpine-slim
    user: nginx
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        echo "Site startup: downloading GitHub site content"
        mkdir -p /tmp/download /tmp/site
        wget -T 30 -O /tmp/site.tar.gz https://codeload.github.com/asullivanr/Base64App/tar.gz/HEAD
        tar -xzf /tmp/site.tar.gz -C /tmp/download --strip-components=1
        if [ -n "$$(find /tmp/download -type l -print -quit)" ]; then
          echo "Site startup: repository contains symbolic links" >&2
          exit 1
        fi
        test -f /tmp/download/public/index.html
        cp -R /tmp/download/public/. /tmp/site/
        rm -rf /tmp/download /tmp/site.tar.gz
        cat > /tmp/nginx.conf <<'NGINX'
        worker_processes auto;
        pid /tmp/nginx.pid;
        error_log /dev/stderr warn;
        events { worker_connections 1024; }
        http {
            include /etc/nginx/mime.types;
            default_type application/octet-stream;
            access_log off;
            sendfile on;
            server_tokens off;
            client_body_temp_path /tmp/client_temp;
            proxy_temp_path /tmp/proxy_temp;
            fastcgi_temp_path /tmp/fastcgi_temp;
            uwsgi_temp_path /tmp/uwsgi_temp;
            scgi_temp_path /tmp/scgi_temp;
            server {
                listen 8080;
                root /tmp/site;
                index index.html;
                add_header Cache-Control "no-store" always;
                add_header X-Content-Type-Options "nosniff" always;
                add_header Referrer-Policy "no-referrer" always;
                add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
                location / {
                    limit_except GET { deny all; }
                }
            }
        }
        NGINX
        nginx -t -c /tmp/nginx.conf
        echo "Site startup: ready"
        exec nginx -c /tmp/nginx.conf -g 'daemon off;'
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 60s
      retries: 3
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
x-casaos:
  title:
    en_us: Base64App
  main: base64
  port_map: "8080"
  scheme: http
  index: /
  description:
    en_us: Encode and decode UTF-8 text using Standard or URL-safe Base64.
